name: Build EDITH MARK 5 APK
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install system deps
        run: |
          sudo apt update
          sudo apt install -y zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev cmake libffi-dev libssl-dev
      - name: Install Python deps
        run: |
          pip install --upgrade pip
          pip install Cython==0.29.33 --force-reinstall
          pip install buildozer==1.5.0
      - name: Accept and Install SDK
        run: |
          mkdir -p ~/.android
          touch ~/.android/repositories.cfg
          yes | sdkmanager --licenses
          sdkmanager --install "build-tools;37.0.0" "build-tools;33.0.2" "platform-tools"
      - name: Build APK
        run: buildozer android debug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: edith-apk
          path: bin/*.apk
